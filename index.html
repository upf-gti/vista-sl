<html>
    <head>
        <title>VISTA-SL Demo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="./imgs/vistasl.png">
        <!-- <link rel="stylesheet" href="./js/lexgui/lexgui.css"> -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lexgui@8.0.0/build/lexgui.css">
        <style>
            html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; }
            .triangle1 {
                width: 0;
                height: 0;
                border-style: solid;
                border-width: 50px 50px 0 0;
                border-color: #21a9e1 transparent transparent transparent;
                margin: 0 auto;
                animation: shk1 1s ease-in-out infinite normal;
            }

            .triangle2 {
                width: 0;
                height: 0;
                border-style: solid;
                border-width: 0 0 50px 50px;
                border-color: transparent transparent #1060a4 transparent;
                margin: -50px auto 0;
                animation: shk2 1s ease-in-out infinite alternate;
            }
            @keyframes shk1 {
                0% {
                    transform: rotate(-360deg);
                }

                100% {
                }
                }

                @keyframes shk2 {
                0% {
                    transform: rotate(360deg);
                }
                100% {
                }
            }

            .hand{
              height:170px;
              position:relative;
              margin:60px auto;
              display:block;
              margin-left:45%;
            }

            .finger{
              width:40px;
              height:110px;
              background:#fff;
              float:left;
              margin-right:3px;
              border-radius:10px 10px 15px 15px;
              position:absolute;  
            }

            .finger:after{
              content: "";
              width:30px;
              height:30px;
              background:#4492F4;
              bottom:10px;
              left:5px;
              position:absolute;
              border-radius:30px 30px 20px 20px;
            }

            .finger:before{
              content: "";
              width:20px;
              height:5px;
              background:#4492F4;
              top:10px;
              left:10px;
              position:absolute;
            }
            .hand .finger:nth-child(1){
                  width: 40px;
                height: 100px;
              bottom:0;
              left:0;
              animation: shake 0.7s ease infinite ;
              animation-delay: 0.0s;
            }
            .hand .finger:nth-child(2){
              width:40px;
              height:135px;
              bottom:0;
              left:45px;
              animation: shake 0.7s ease infinite ;
              animation-delay: 0.1s;
            }

            .hand .finger:nth-child(3){
              width:40px;
              height:150px;
              bottom:0px;
              left:90px;
              animation: shake 0.7s ease infinite;
              animation-delay: 0.2s;
            }

            .hand .finger:nth-child(4){
              width:40px;
              height:135px;
              bottom:0;
              left:135px;
              animation: shake 0.7s ease infinite ;
              animation-delay: 0.3s;
            }


            .thumb{
              position:relative;
              background:#fff;
              width:60px;
              height:50px;
              float:left;
              left:180px;
              bottom:0;
              margin-top:50px;
              border-radius: 0px 30px 90px 0px;
              animation: shake 0.7s ease infinite ;
              animation-delay: 0.4s;
            }
            
            @keyframes shake {
              0% {
              bottom:0;
              }
              
              50% {
              bottom:10%;
              }
              
              100% {
              bottom:0px;
              }
              
            }
            .text {
                color: #949494;
                margin: 30px auto;
                text-align: center;
                font-weight: 500;
                letter-spacing: 4px;
            }

        </style>
        <script src="./external/jquery-3.6.0.min.js"></script>
        <script async src="./external/es-module-shims.js"></script>
